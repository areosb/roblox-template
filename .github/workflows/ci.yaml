name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install lpm
        run: |
          curl -fsSL -o lpm-linux https://github.com/luaupm/cli/releases/latest/download/lpm-linux-x86_64
          chmod +x lpm-linux
          ./lpm-linux self install
          echo "$HOME/.lpm/bin" >> "$GITHUB_PATH"

      - name: Cache lpm
        uses: actions/cache@v6
        with:
          path: |
            ~/.lpm/archive-cache
            ~/.lpm/index-cache
          key: lpm-archives-${{ runner.os }}-${{ hashFiles('lpm.lock') }}
          restore-keys: lpm-archives-${{ runner.os }}-

      - name: Install dependencies and tools
        run: lpm install

      - name: Format
        run: larvae fmt --check

      - name: Lint
        run: larvae lint

      - name: Check
        run: larvae check

      - name: Build
        run: |
          larvae process
          rogen
          rojo build .larvae/build.project.json --output game.rbxl

      - name: Tests
        run: lest